# ─────────────────────── /custom_prompt — manual, on-demand only
# Invoke by commenting /custom_prompt on any PR. Use this for a targeted
# regression pass on a risky lecture-player or agent change.
[pr_custom_prompt]
prompt = """\
Review this PR ONLY for ways it can break behaviour that works today. Report nothing else.

- A prop, handler or condition added in one of the three lecture layouts (portrait mobile,
  landscape mobile-tablet, desktop) but missing from the others.
- Weakening of the `canSkipVideo === false` forward-seek lock in any of its five enforcement
  points.
- A `VideoPlayer` prop read inside the `[src, isClient]` init effect with no `key` remount at
  the call site, or a dependency-array change that now re-initialises the player mid-playback.
- A new or renamed LiveKit data packet `type`/field handled in `lib/livekit.js` but not in
  `VideoPanel` and `FloatingChatbot`, or vice versa.
- A singleton (`liveKitService`, `notificationService`) gaining a consumer without matching
  cleanup, or overwriting another consumer's callbacks.
- A new RTK Query slice not registered in all three places in `store/index.js`; a `Question`
  tag invalidation added where it will refetch slides and restart playback.
- An assessment path that writes only one of `markAssessmentCompleted` / `setAssessmentCompleted`,
  or that crosses the middle-vs-final branch incorrectly.
- A new i18n key in `en.json` without `de.json`; a new per-user localStorage key not added to
  `USER_SCOPED_STORAGE_KEYS`; a new `NEXT_PUBLIC_*` var not added to the Dockerfile and compose.
- `window`/`document`/`localStorage`/`navigator` reached during render or module init without a
  guard (the build is never run on PRs).
- A missing `useEffect` cleanup for a listener, interval, socket, media track or LiveKit room.

For each finding, name the exact flow that breaks and the condition that triggers it.
"""
suggestions_score_threshold = 5

name: Build and Push Docker Image V2

on:
  # push:
  #   branches:
  #     - prod
  #     - dev
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'prod'
        type: string
      image_tag:
        description: 'Custom image tag (optional — defaults to <branch>-<commit-sha>)'
        required: false
        type: string
      env_vars:
        description: 'Build-time vars as KEY=VALUE (one per line) OR a JSON object'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

      - name: Guard against unexpected release target
        if: github.event_name == 'release'
        run: |
          echo "Release '${{ github.event.release.tag_name }}' targets branch: ${{ github.event.release.target_commitish }}"
          ALLOWED_BRANCHES=("prod" "echo-dev")
          TARGET="${{ github.event.release.target_commitish }}"
          MATCH=0
          for b in "${ALLOWED_BRANCHES[@]}"; do
            [[ "$TARGET" == "$b" ]] && MATCH=1
          done
          if [[ "$MATCH" -eq 0 ]]; then
            echo "::error::Release targets '$TARGET', which isn't in the allowed list (${ALLOWED_BRANCHES[*]}). Check the Target dropdown when publishing the release."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Confirm what was actually checked out
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "Event: ${{ github.event_name }}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --pretty=%s)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch-specific secret name
        id: branch_meta
        if: github.event_name == 'workflow_dispatch'
        run: |
          BRANCH="${{ inputs.branch }}"
          # Secret names may only contain [A-Z0-9_] — sanitize and uppercase.
          SAFE=$(echo "$BRANCH" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')
          echo "safe_branch=$SAFE" >> "$GITHUB_OUTPUT"
          echo "Resolved branch '$BRANCH' -> secret suffix '$SAFE' (looks for DEFAULT_${SAFE}_BUILD_ENV_VARS)"

      - name: Parse and mask manual build args
        id: parse_env
        if: github.event_name == 'workflow_dispatch'
        env:
          RAW_ENV: ${{ inputs.env_vars }}
          BRANCH_ENV_JSON: ${{ secrets[format('DEFAULT_{0}_BUILD_ENV_VARS', steps.branch_meta.outputs.safe_branch)] }}
          DEFAULT_ENV_JSON: ${{ secrets.DEFAULT_BUILD_ENV_VARS }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          def clean(val):
              return (val or "").strip()

          branch_secret_name = "DEFAULT_${{ steps.branch_meta.outputs.safe_branch }}_BUILD_ENV_VARS"

          # Each candidate: (label used in logs, human-readable origin, raw value)
          candidates = [
              ("input", "the 'env_vars' field on the manual trigger", clean(os.environ.get("RAW_ENV"))),
              ("branch secret", f"secret '{branch_secret_name}'", clean(os.environ.get("BRANCH_ENV_JSON"))),
              ("default secret", "secret 'DEFAULT_BUILD_ENV_VARS'", clean(os.environ.get("DEFAULT_ENV_JSON"))),
          ]

          print("::group::Resolving build-time env vars")
          print("Checking sources in priority order:")
          for label, origin, value in candidates:
              status = "found" if value else "empty / not set"
              print(f"  - {label} ({origin}): {status}")

          raw = ""
          source_label = "none"
          source_origin = "no source (all candidates empty)"
          for label, origin, value in candidates:
              if value:
                  raw = value
                  source_label = label
                  source_origin = origin
                  break
          print(f"==> Selected source: {source_label} — {source_origin}")
          print("::endgroup::")

          lines = []
          parse_mode = "none"
          if raw:
              try:
                  data = json.loads(raw)
                  lines = [f"{k}={v}" for k, v in data.items()]
                  parse_mode = "JSON object"
              except json.JSONDecodeError:
                  parse_mode = "KEY=VALUE lines"
                  for line in raw.splitlines():
                      line = line.strip()
                      if line and "=" in line and not line.startswith("#"):
                          lines.append(line)

          out = "\n".join(lines)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("build_args<<EOF_DELIM\n")
              f.write(out + "\n")
              f.write("EOF_DELIM\n")

          var_names = []
          for line in lines:
              if "=" in line:
                  key, value = line.split("=", 1)
                  var_names.append(key)
                  if value:
                      print(f"::add-mask::{value}")

          print("::group::Build-time variables summary")
          print(f"Source: {source_label} ({source_origin})")
          print(f"Format parsed as: {parse_mode}")
          print(f"Variable count: {len(var_names)}")
          if var_names:
              print("Variable names (values are masked and not logged):")
              for name in var_names:
                  print(f"  - {name}")
          else:
              print("No build-time variables were set — build-args will be empty.")
          print("::endgroup::")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("### Build-time env vars\n")
                  f.write(f"- **Source:** {source_label} ({source_origin})\n")
                  f.write(f"- **Parsed as:** {parse_mode}\n")
                  f.write(f"- **Variable count:** {len(var_names)}\n")
                  if var_names:
                      f.write("- **Variables:** " + ", ".join(f"`{n}`" for n in var_names) + "\n")
          PYEOF

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=raw,value=${{ inputs.branch }}-${{ steps.vars.outputs.sha_short }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=pep440,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.parse_env.outputs.build_args }}
          secrets: |
            npm_token=${{ secrets.PERSONAL_ACCESS_TOKEN }}
